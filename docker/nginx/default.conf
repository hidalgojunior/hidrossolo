server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Limite de tamanho de upload (a biblioteca de mídias aceita até 10MB por arquivo)
    client_max_body_size 64M;

    # Evitar redirects com porta errada
    absolute_redirect off;

    # Logs
    access_log /var/log/nginx/hidrossolo_access.log;
    error_log /var/log/nginx/hidrossolo_error.log;

    # Segurança: bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }

    # Arquivos estáticos versionados na raiz do projeto (assets/)
    location ^~ /assets/ {
        alias /var/www/html/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Rotas amigáveis
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Admin routes
    location /admin {
        try_files $uri $uri/ /admin/index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Cache de assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Bloquear acesso a arquivos sensíveis
    location ~* \.(env|log|sql|yml|yaml)$ {
        deny all;
    }
}
