<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101a2e">
    <title>Sem conexão — Hidrossolo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: Tahoma, Verdana, "Segoe UI", Geneva, sans-serif;
            background: linear-gradient(160deg, #0b1220 0%, #16233d 100%);
            color: #e2e8f0;
            text-align: center;
        }
        .box { max-width: 420px; }
        .marca {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin-bottom: 1.25rem;
            border-radius: 18px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: #fff;
            font-size: 1.6rem;
            font-weight: 700;
        }
        h1 { font-size: 1.4rem; margin: 0 0 .6rem; color: #fff; }
        p { color: #94a3b8; font-size: .92rem; line-height: 1.6; margin: 0 0 1.5rem; }
        .tag {
            display: inline-block;
            padding: .3rem .85rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(148, 163, 184, .35);
            border-radius: 999px;
            color: #cbd5e1;
            font-size: .75rem;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        button {
            padding: .8rem 1.8rem;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: #fff;
            font-family: inherit;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .hint { margin-top: 1.5rem; font-size: .8rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="box">
        <div class="marca" aria-hidden="true">H</div>
        <div class="tag">Modo offline</div>
        <h1>Você está sem conexão</h1>
        <p>
            Não foi possível carregar esta página agora. Verifique a conexão do aparelho
            e tente novamente.
        </p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
        <div class="hint">
            Dica: o app continua instalado no seu celular — ao voltar o sinal, os dados são carregados normalmente.
        </div>
    </div>
</body>
</html>
